budget: 512          # post-reduction sequence length (what the backbone pays for)
pool_budget: 512     # degenerate control: pool == budget -> 0 reduction rounds.
                     # _hierarchical_reduce is a no-op; this is plain hard-select
                     # (selector cuts budget -> round(budget*keep_ratio)) on an
                     # evenly-spaced 32-frame pool. Isolates "is the selector cut
                     # better than frameSamp?" from the hierarchical reduction and
                     # from random-frame sampling.
                     #
                     # EVAL-ONLY VARIANT of perceptual-hiersel-modul_pool512.yaml:
                     # architecturally identical, adds selector.eval_keep_all so a
                     # checkpoint trained with the base yaml can be served with the
                     # final trained cut skipped. Loads against base-yaml weights
                     # (eval_keep_all touches no params). Point a local
                     # history_config.txt at this file to run the ablation.
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
use_time_emb: true
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
  time:
    input_dim: 1
    hidden_dim: 64
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: hierarchical_selection
  pool_sampling: even
  selector:
    enabled: true
    keep_ratio: 0.5
    depth: 2
    num_heads: 8
    num_register_tokens: 4
    ratio_loss_weight: 0.001
    z_loss_weight: 1e-4
    load_balance_loss_weight: 1e-4
    eval_keep_all: true  # skip the final budget->num_keep cut at inference;
                         # all 512 post-reduction tokens go to the backbone
