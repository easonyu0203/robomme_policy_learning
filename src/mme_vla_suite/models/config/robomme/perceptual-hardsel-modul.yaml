budget: 512
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
use_time_emb: true
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
  time:
    input_dim: 1
    hidden_dim: 64
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: random_sampling
  selector:
    enabled: true
    keep_ratio: 0.5 # fraction of the `budget` tokens kept at inference time
    depth: 2 # selector transformer depth -- kept small relative to the backbone
    num_heads: 8
    num_register_tokens: 4
    ratio_loss_weight: 2.0
    z_loss_weight: 1e-4
    load_balance_loss_weight: 0.0
