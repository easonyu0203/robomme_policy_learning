budget: 64           # tokens fed to the trained selector cut (4 frames at token_per_image 16)
                     #
                     # = perceptual-hardsel-modul_bud64_pool128.yaml with the trained
                     # selector cut switched from per-token Bernoulli + ratio/z/
                     # load-balance losses to Gumbel-top-k (selector.gumbel_topk):
                     # exactly num_keep kept, same rule in train (Gumbel noise) and
                     # eval, no auxiliary losses. The two-stage frame pick in the
                     # data loader is UNCHANGED. Companion of
                     # perceptual-hiersel-modul_bud64_pool128_multilevel_topk.yaml
                     # (learned 8->4 reduction) and perceptual-dnr-modul_bud64_pool128.yaml
                     # (e2e tree).
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
use_time_emb: true
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
  time:
    input_dim: 1
    hidden_dim: 64
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: random_sampling
  # Two-stage frame pick (data loader, shared/mem_buffer.py::get_random_sampling_indices),
  # unchanged from perceptual-hardsel-modul_bud64_pool128.yaml:
  #   1. a `pool_budget`-wide EVENLY-SPACED frame grid over the causal history
  #      (128 tokens -> 8 frames), then
  #   2. a fresh UNIFORMLY-RANDOM `budget`-wide subset of that grid every step
  #      (64 tokens -> 4 frames), train and eval alike (indices returned time-sorted),
  # then the trained selector cut below.
  pool_budget: 128
  selector:
    enabled: true
    keep_ratio: 0.5   # trained cut: budget -> round(budget * keep_ratio) = 64 -> 32
    depth: 2
    num_heads: 8
    num_register_tokens: 4
    # ---- Gumbel-top-k cut (replaces Bernoulli + ratio/z/load-balance) ----
    sampling: topk           # Gumbel-top-k: exactly K kept, same rule train/eval; no aux losses
    score_norm: zscore       # standardize keep-margins within the sequence (replaces z-loss)
    tau: 1.0                 # sigmoid width of the straight-through relaxation (z-scored units)
    noise_scale: 1.0         # Gumbel noise scale in training (0 = deterministic)
    ratio_loss_weight: 0.0
    z_loss_weight: 0.0
    load_balance_loss_weight: 0.0
