budget: 64           # 64 / token_per_image(16) = 4 evenly-spaced sampled frames
                     # budget-64 point for the frame_sampling baseline, to sit
                     # alongside perceptual-hiersel-modul_bud64_pool64 /
                     # perceptual-hiersel-modul_bud64_pool128_multilevel.
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
use_time_emb: true
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
  time:
    input_dim: 1
    hidden_dim: 64
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: frame_sampling
