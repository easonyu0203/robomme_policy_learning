budget: 64           # root width (2K): tokens the trained cut sees; K = 32 kept
pool_budget: 512     # 32 even-spaced frames; 3 rounds (512->256->128->64) + root cut; 15 nodes
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
use_time_emb: true       # recency log1p(steps-ago); also the source of mem_rope=time positions
mem_rope: time           # MemoryAttention keys RoPE by steps-ago, not array slot (gather-safe)
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
  time:
    input_dim: 1
    hidden_dim: 64
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: hierarchical_selection
  pool_sampling: even
  selector:
    enabled: true
    keep_ratio: 0.5          # every node keeps K = 32 of its 2K = 64 inputs
    depth: 2
    num_heads: 8
    num_register_tokens: 4
    # ---- D&R fixes (2026-09-07) ----
    sampling: topk           # Gumbel-top-k: exactly K kept, same rule train/eval; no aux losses
    score_norm: zscore       # pins the margin scale (replaces z-loss)
    tau: 1.0                 # sigmoid width of the straight-through relaxation (z-scored units)
    noise_scale: 1.0         # Gumbel noise scale in training (0 = deterministic)
    e2e_tree: true           # full-tree backprop; replaces multilevel + ema_reducer
    multilevel: false
    ema_reducer: false
    root_gather: true        # policy receives the K kept tokens physically (needs mem_rope=time)
    ratio_loss_weight: 0.0
    z_loss_weight: 0.0
    load_balance_loss_weight: 0.0
